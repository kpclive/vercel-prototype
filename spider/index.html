<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPCLIVE 选手积分 · 原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:#f1f5f9; color:#1e293b; }
  /* 顶部端切换 */
  .topbar { height:52px; background:#ffffff; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; padding:0 20px; gap:16px; position:sticky; top:0; z-index:50; }
  .topbar .logo { font-weight:700; color:#0f172a; font-size:15px; letter-spacing:.5px; }
  .topbar .logo span { color:#3b82f6; }
  .seg { display:flex; background:#e2e8f0; border-radius:8px; padding:3px; }
  .seg button { border:0; background:transparent; color:#64748b; padding:6px 16px; border-radius:6px; cursor:pointer; font-size:13px; }
  .seg button.active { background:#3b82f6; color:#fff; }
  .topbar .hint { margin-left:auto; font-size:12px; color:#94a3b8; }

  .view { display:none; }
  .view.active { display:block; }

  /* ============ 运营后台 ============ */
  .admin-wrap { min-width:1280px; }
  .crumb { padding:14px 24px; font-size:13px; color:#64748b; }
  .crumb b { color:#1e293b; }
  .admin-grid { display:grid; grid-template-columns:480px 1fr; gap:0; min-height:calc(100vh - 118px); }
  .form-panel { background:#ffffff; border-right:1px solid #e2e8f0; padding:24px; overflow-y:auto; }
  .chart-panel { padding:24px 32px; }
  .sec-title { font-size:13px; color:#3b82f6; font-weight:600; margin:18px 0 12px; padding-bottom:6px; border-bottom:1px solid #e2e8f0; }
  .sec-title:first-child { margin-top:0; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:12px; color:#64748b; margin-bottom:6px; }
  .field label .u { color:#94a3b8; }
  .field input, .field select { width:100%; background:#f8fafc; border:1px solid #cbd5e1; color:#1e293b; border-radius:7px; padding:9px 11px; font-size:13px; }
  .field input:focus, .field select:focus { outline:none; border-color:#3b82f6; background:#fff; }
  .field select:disabled { color:#94a3b8; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .range-row { display:flex; align-items:center; gap:10px; }
  .slider-wrap { position:relative; flex:1; height:22px; display:flex; align-items:center; }
  .slider-wrap input[type=range] { width:100%; accent-color:#3b82f6; }
  .tick100 { position:absolute; top:50%; left:76.9%; width:9px; height:9px; border-radius:50%; background:#ef4444; transform:translate(-50%,-50%); box-shadow:0 0 0 2px #fff; pointer-events:none; }
  .range-row .val { width:48px; text-align:right; font-size:13px; color:#1e293b; font-variant-numeric:tabular-nums; }
  .sec-note { font-size:11px; color:#94a3b8; margin:-4px 0 12px; }
  .sec-note .rd { color:#ef4444; }
  .save-bar { margin-top:22px; display:flex; gap:12px; }
  .btn { border:0; border-radius:8px; padding:11px 20px; font-size:13px; cursor:pointer; }
  .btn-primary { background:#3b82f6; color:#fff; }
  .btn-ghost { background:#e2e8f0; color:#475569; }

  /* 右侧图表区 */
  .score-cards { display:flex; gap:16px; margin-bottom:24px; }
  .score-card { background:#ffffff; border:1px solid #e2e8f0; border-radius:12px; padding:16px 20px; flex:1; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .score-card .k { font-size:12px; color:#64748b; }
  .score-card .v { font-size:26px; font-weight:700; margin-top:6px; font-variant-numeric:tabular-nums; color:#1e293b; }
  .v.pos { color:#16a34a; } .v.neg { color:#dc2626; }
  .badge { display:inline-block; font-size:12px; padding:3px 10px; border-radius:20px; margin-top:8px; }
  .badge.ok { background:rgba(22,163,74,.12); color:#16a34a; }
  .badge.no { background:rgba(220,38,38,.12); color:#dc2626; }
  .radar-box { background:#ffffff; border:1px solid #e2e8f0; border-radius:14px; padding:24px; display:flex; gap:28px; align-items:center; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .radar-legend { flex:1; }
  .legend-item { display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid #f1f5f9; font-size:13px; }
  .legend-item:last-child { border-bottom:0; }
  .legend-item .name { color:#334155; }
  .legend-item .name small { color:#94a3b8; display:block; font-size:11px; }
  .legend-item .raw { color:#1e293b; font-variant-numeric:tabular-nums; }
  .legend-item .norm { color:#3b82f6; font-size:11px; margin-left:8px; }

  /* ============ 用户端 ============ */
  .user-wrap { padding:24px; display:flex; flex-direction:column; align-items:center; }
  .device-seg { margin-bottom:22px; }
  .device { background:#fff; border-radius:22px; overflow:hidden; box-shadow:0 20px 60px rgba(15,23,42,.18); }
  .device.phone { width:390px; border:8px solid #1e293b; border-radius:38px; }
  .device.pc { width:980px; border:1px solid #e2e8f0; border-radius:14px; }
  .scr { background:#f8fafc; height:760px; overflow-y:auto; }
  .device.pc .scr { height:620px; }
  /* app/h5 头部 */
  .app-head { background:linear-gradient(135deg,#1e3a8a,#3b82f6); padding:18px 16px 16px; color:#fff; }
  .app-head .t { font-size:18px; font-weight:700; }
  .app-head .season { display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:12px; opacity:.95; }
  .app-head .countdown { background:rgba(255,255,255,.22); padding:3px 10px; border-radius:20px; }
  .tabbar { display:flex; background:#fff; border-bottom:1px solid #e2e8f0; }
  .tabbar div { flex:1; text-align:center; padding:12px 0; font-size:13px; color:#64748b; cursor:pointer; }
  .tabbar div.on { color:#3b82f6; border-bottom:2px solid #3b82f6; font-weight:600; }
  /* 榜单 */
  .rank-list { padding:8px 0; background:#fff; }
  .rank-row { display:flex; align-items:center; padding:12px 16px; gap:12px; cursor:pointer; border-bottom:1px solid #f1f5f9; }
  .rank-row:hover { background:#f8fafc; }
  .rk { width:26px; text-align:center; font-weight:700; font-size:15px; color:#94a3b8; font-variant-numeric:tabular-nums; }
  .rk.g1 { color:#f59e0b; } .rk.g2 { color:#94a3b8; } .rk.g3 { color:#d97706; }
  .avatar { width:40px; height:40px; border-radius:50%; background:#e2e8f0; display:flex; align-items:center; justify-content:center; font-size:15px; color:#475569; font-weight:600; flex-shrink:0; }
  .rinfo { flex:1; min-width:0; }
  .rinfo .nm { font-size:14px; color:#1e293b; font-weight:600; }
  .rinfo .sub { font-size:11px; color:#94a3b8; margin-top:2px; }
  .rscore { text-align:right; }
  .rscore .pt { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; }
  .rscore .pt.pos { color:#16a34a; } .rscore .pt.neg { color:#dc2626; }
  .rscore .lab { font-size:10px; color:#94a3b8; }
  /* 详情页 */
  .detail { padding:0 0 24px; background:#fff; }
  .det-hero { background:linear-gradient(135deg,#1e3a8a,#3b82f6); padding:22px 18px; text-align:center; color:#fff; }
  .det-hero .av { width:64px; height:64px; border-radius:50%; background:rgba(255,255,255,.22); margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; }
  .det-hero .nm { font-size:19px; font-weight:700; }
  .det-hero .meta { font-size:12px; opacity:.85; margin-top:4px; }
  .det-stats { display:flex; padding:14px 0; border-bottom:1px solid #e2e8f0; }
  .det-stats .s { flex:1; text-align:center; }
  .det-stats .s .v { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; color:#1e293b; }
  .det-stats .s .v.pos{color:#16a34a;} .det-stats .s .v.neg{color:#dc2626;}
  .det-stats .s .k { font-size:11px; color:#94a3b8; margin-top:2px; }
  .det-radar { padding:20px 16px; text-align:center; }
  .det-radar h4 { font-size:14px; color:#1e293b; margin-bottom:4px; text-align:left; }
  .det-radar .desc { font-size:11px; color:#94a3b8; text-align:left; margin-bottom:10px; }
  .det-six { padding:0 16px; }
  .six-item { display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid #f1f5f9; font-size:13px; }
  .six-item .l { color:#334155; } .six-item .l small{ color:#94a3b8; }
  .six-item .r { color:#3b82f6; font-weight:600; font-variant-numeric:tabular-nums; }
  .back { padding:12px 16px; color:#3b82f6; font-size:13px; cursor:pointer; background:#fff; }
  /* PC 端布局 */
  .pc-layout { display:flex; height:100%; background:#fff; }
  .pc-left { width:55%; border-right:1px solid #e2e8f0; overflow-y:auto; }
  .pc-right { flex:1; overflow-y:auto; }
  .pc-head { padding:16px 20px; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center; }
  .pc-head .t { font-size:16px; font-weight:700; color:#0f172a; }
  .empty-tip { padding:40px 20px; text-align:center; color:#94a3b8; font-size:13px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">KPC<span>LIVE</span> · 选手积分</div>
  <div class="seg">
    <button id="t-admin" class="active" onclick="switchEnd('admin')">运营后台</button>
    <button id="t-user" onclick="switchEnd('user')">用户端</button>
  </div>
  <div class="hint">原型演示 · 单赛季周期=1周 · 仅高额桌 · 数据源：赛事方结构化牌谱</div>
</div>

<!-- ================= 运营后台 ================= -->
<div id="view-admin" class="view active">
 <div class="admin-wrap">
  <div class="crumb">选手积分管理 / <b>选手数据录入</b></div>
  <div class="admin-grid">
    <!-- 左：表单 -->
    <div class="form-panel">
      <div class="sec-title">基础信息</div>
      <div class="field">
        <label>选手名称</label>
        <input id="f-name" value="陈一鸣" oninput="render()">
      </div>
      <div class="row2">
        <div class="field">
          <label>语言 <span class="u">(i18n)</span></label>
          <select id="f-lang" onchange="render()">
            <option value="zh">简体中文</option><option value="en">English</option><option value="zh-TW">繁體中文</option>
          </select>
        </div>
        <div class="field">
          <label>所属赛季</label>
          <select id="f-season" onchange="render()">
            <option>2026-W26（本周）</option><option>2026-W25</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>桌型</label>
          <select disabled><option>高额桌（High Stakes）</option></select>
        </div>
        <div class="field">
          <label>盲注级别 <span class="u">BB</span></label>
          <input id="f-blind" value="100/200" oninput="render()">
        </div>
      </div>

      <div class="sec-title">积分 / 入榜</div>
      <div class="row2">
        <div class="field">
          <label>净盈亏 <span class="u">(BB · 即赛季积分)</span></label>
          <input id="f-bb" type="number" value="1248.5" oninput="render()">
        </div>
        <div class="field">
          <label>有效手数</label>
          <input id="f-hands" type="number" value="320" oninput="render()">
        </div>
      </div>

      <div class="sec-title">六维打法得分（用于六星图）</div>
      <div class="sec-note">每维 0–130 分：拖到<span class="rd">●红点=100满档</span>（雷达边缘），可继续突破至 130 冲出边缘。</div>
      <div class="field"><label>① 盈利能力 <span class="u">BB/100</span></label>
        <div class="range-row"><div class="slider-wrap"><input id="m-bb100" type="range" min="0" max="130" step="1" value="101" oninput="render()"><span class="tick100"></span></div><span class="val" id="v-bb100">101</span></div></div>
      <div class="field"><label>② 入池率 <span class="u">VPIP</span></label>
        <div class="range-row"><div class="slider-wrap"><input id="m-vpip" type="range" min="0" max="130" step="1" value="82" oninput="render()"><span class="tick100"></span></div><span class="val" id="v-vpip">82</span></div></div>
      <div class="field"><label>③ 翻前激进 <span class="u">PFR</span></label>
        <div class="range-row"><div class="slider-wrap"><input id="m-pfr" type="range" min="0" max="130" step="1" value="99" oninput="render()"><span class="tick100"></span></div><span class="val" id="v-pfr">99</span></div></div>
      <div class="field"><label>④ 翻后激进 <span class="u">AF</span></label>
        <div class="range-row"><div class="slider-wrap"><input id="m-af" type="range" min="0" max="130" step="1" value="78" oninput="render()"><span class="tick100"></span></div><span class="val" id="v-af">78</span></div></div>
      <div class="field"><label>⑤ 摊牌倾向 <span class="u">WTSD</span></label>
        <div class="range-row"><div class="slider-wrap"><input id="m-wtsd" type="range" min="0" max="130" step="1" value="93" oninput="render()"><span class="tick100"></span></div><span class="val" id="v-wtsd">93</span></div></div>
      <div class="field"><label>⑥ 摊牌质量 <span class="u">W$SD</span></label>
        <div class="range-row"><div class="slider-wrap"><input id="m-wsd" type="range" min="0" max="130" step="1" value="98" oninput="render()"><span class="tick100"></span></div><span class="val" id="v-wsd">98</span></div></div>

      <div class="save-bar">
        <button class="btn btn-primary">保存并发布到榜单</button>
        <button class="btn btn-ghost">重置</button>
      </div>
    </div>

    <!-- 右：动态六星图 -->
    <div class="chart-panel">
      <div class="score-cards">
        <div class="score-card"><div class="k">赛季积分（净盈亏 BB）</div><div class="v" id="c-score">+1248.5</div></div>
        <div class="score-card"><div class="k">有效手数</div><div class="v" id="c-hands">320</div><div id="c-badge" class="badge ok">已达入榜门槛（≥100手）</div></div>
      </div>
      <div class="radar-box">
        <div id="radar-admin"></div>
        <div class="radar-legend" id="legend-admin"></div>
      </div>
    </div>
  </div>
 </div>
</div>

<!-- ================= 用户端 ================= -->
<div id="view-user" class="view">
  <div class="user-wrap">
    <div class="seg device-seg">
      <button id="d-app" class="active" onclick="switchDevice('app')">App</button>
      <button id="d-pc" onclick="switchDevice('pc')">PC 官网</button>
      <button id="d-h5" onclick="switchDevice('h5')">H5</button>
    </div>
    <div id="device-mount"></div>
  </div>
</div>

<script>
/* ---------- 六星图渲染（SVG，复用于后台和用户端） ---------- */
/* 每维直接是六星图得分(0-130)：100=满档(雷达边缘)，可突破至130冲出边缘。sub 仅标注对应牌谱指标。 */
const DIMS = [
  {key:'bb100', label:'盈利能力', sub:'BB/100'},
  {key:'vpip',  label:'入池率',   sub:'VPIP'},
  {key:'pfr',   label:'翻前激进', sub:'PFR'},
  {key:'af',    label:'翻后激进', sub:'AF'},
  {key:'wtsd',  label:'摊牌倾向', sub:'WTSD'},
  {key:'wsd',   label:'摊牌质量', sub:'W$SD'},
];
const VCAP = 130; // 满档=100(雷达边缘)，可突破至130(冲出边缘)
function norm(d, val){ return Math.max(0, Math.min(VCAP, val)); }
function avg6(v){ return DIMS.reduce((s,d)=>s+v[d.key],0)/DIMS.length; }

function radarSVG(values, size){
  const cx=size/2, cy=size/2, R=size/2-58, N=6;
  const ang=i=> -Math.PI/2 + i*2*Math.PI/N;
  // R 对应归一值 100（雷达边缘）；最大可画到 1.2R（突破）
  let grid='', edgeStroke='';
  // 100 边缘区域（背景淡填充，界定"满档"范围，突破部分落在区域外更清晰）
  let edge=[]; for(let i=0;i<N;i++){ edge.push((cx+R*Math.cos(ang(i)))+','+(cy+R*Math.sin(ang(i)))); }
  grid+=`<polygon points="${edge.join(' ')}" fill="#f1f5f9"/>`;
  // 内圈：浅色细线
  [0.25,0.5,0.75].forEach(f=>{
    let pts=[]; for(let i=0;i<N;i++){ pts.push((cx+R*f*Math.cos(ang(i)))+','+(cy+R*f*Math.sin(ang(i)))); }
    grid+=`<polygon points="${pts.join(' ')}" fill="none" stroke="#e2e8f0" stroke-width="1"/>`;
  });
  // 100 边缘描边：加粗深色实线（最后叠加，确保最清晰）
  edgeStroke=`<polygon points="${edge.join(' ')}" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>`;
  const EX = VCAP/100; // 1.2，坐标轴/标签外延空间
  let axes='', labels='';
  for(let i=0;i<N;i++){
    const x=cx+R*EX*Math.cos(ang(i)), y=cy+R*EX*Math.sin(ang(i));
    axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`;
    const lx=cx+(R*EX+22)*Math.cos(ang(i)), ly=cy+(R*EX+22)*Math.sin(ang(i));
    const anchor = Math.abs(Math.cos(ang(i)))<0.3?'middle':(Math.cos(ang(i))>0?'start':'end');
    labels+=`<text x="${lx}" y="${ly}" fill="#64748b" font-size="12" text-anchor="${anchor}" dominant-baseline="middle">${DIMS[i].label}</text>`;
  }
  let dpts=[]; for(let i=0;i<N;i++){ const f=norm(DIMS[i],values[DIMS[i].key])/100; dpts.push((cx+R*f*Math.cos(ang(i)))+','+(cy+R*f*Math.sin(ang(i)))); }
  const dots=dpts.map(p=>{const [x,y]=p.split(',');return `<circle cx="${x}" cy="${y}" r="3" fill="#3b82f6"/>`}).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    ${grid}${axes}
    <polygon points="${dpts.join(' ')}" fill="rgba(59,130,246,.28)" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round"/>
    ${edgeStroke}
    ${dots}${labels}
  </svg>`;
}

/* ---------- 后台：读表单 → 实时渲染 ---------- */
function readForm(){
  const g=id=>parseFloat(document.getElementById(id).value)||0;
  const v={ bb100:g('m-bb100'), vpip:g('m-vpip'), pfr:g('m-pfr'), af:g('m-af'), wtsd:g('m-wtsd'), wsd:g('m-wsd') };
  ['bb100','vpip','pfr','af','wtsd','wsd'].forEach(k=>{ document.getElementById('v-'+k).textContent=Math.round(v[k]); });
  return v;
}
function render(){
  const vals=readForm();
  document.getElementById('radar-admin').innerHTML=radarSVG(vals,320);
  // legend
  let lg='';
  DIMS.forEach(d=>{ const nv=norm(d,vals[d.key]); const over=nv>100;
    lg+=`<div class="legend-item"><div class="name">${d.label}<small>${d.sub}</small></div>
    <div><span class="norm" style="${over?'color:#1d4ed8;font-weight:700;':''}">${Math.round(nv)}/100${over?' ↑突破':''}</span></div></div>`; });
  document.getElementById('legend-admin').innerHTML=lg;
  // 积分卡
  const bb=parseFloat(document.getElementById('f-bb').value)||0;
  const sc=document.getElementById('c-score'); sc.textContent=(bb>0?'+':'')+bb.toFixed(1); sc.className='v '+(bb>=0?'pos':'neg');
  const hands=parseInt(document.getElementById('f-hands').value)||0;
  document.getElementById('c-hands').textContent=hands;
  const b=document.getElementById('c-badge');
  if(hands>=100){ b.className='badge ok'; b.textContent='已达入榜门槛（≥100手）'; }
  else { b.className='badge no'; b.textContent='样本不足，不参与排名（需≥100手）'; }
}

/* ---------- 端切换 ---------- */
function switchEnd(end){
  document.getElementById('view-admin').classList.toggle('active', end==='admin');
  document.getElementById('view-user').classList.toggle('active', end==='user');
  document.getElementById('t-admin').classList.toggle('active', end==='admin');
  document.getElementById('t-user').classList.toggle('active', end==='user');
  if(end==='user') renderDevice();
}

/* ---------- 用户端数据 ---------- */
/* vals 为六维得分(0-130) */
const PLAYERS=[
  {nm:'陈一鸣', score:1248.5, hands:320, vals:{bb100:101,vpip:82, pfr:99, af:78, wtsd:93, wsd:98}},
  {nm:'KingLi', score:986.0,  hands:412, vals:{bb100:91, vpip:104,pfr:90, af:60, wtsd:107,wsd:89}},
  {nm:'阿水',   score:742.5,  hands:268, vals:{bb100:106,vpip:66, pfr:83, af:100,wtsd:73, wsd:106}},
  {nm:'Maverick',score:610.0, hands:355, vals:{bb100:82, vpip:128,pfr:120,af:130,wtsd:117,wsd:84}},
  {nm:'老张',   score:355.0,  hands:190, vals:{bb100:73, vpip:73, pfr:70, af:50, wtsd:87, wsd:95}},
  {nm:'Q仔',    score:-180.0, hands:240, vals:{bb100:44, vpip:130,pfr:130,af:130,wtsd:130,wsd:76}},
];
let curDevice='app', curPlayer=null;
function switchDevice(d){ curDevice=d; curPlayer=null;
  ['app','pc','h5'].forEach(x=>document.getElementById('d-'+x).classList.toggle('active', x===d));
  renderDevice();
}
function rankClass(i){ return i===0?'g1':i===1?'g2':i===2?'g3':''; }

function listHTML(){
  let rows='';
  PLAYERS.forEach((p,i)=>{
    rows+=`<div class="rank-row" onclick="openDetail(${i})">
      <div class="rk ${rankClass(i)}">${i+1}</div>
      <div class="avatar">${p.nm[0]}</div>
      <div class="rinfo"><div class="nm">${p.nm}</div><div class="sub">六维均分 ${Math.round(avg6(p.vals))} · ${p.hands}手 · 高额桌</div></div>
      <div class="rscore"><div class="pt ${p.score>=0?'pos':'neg'}">${p.score>0?'+':''}${p.score.toFixed(1)}</div><div class="lab">积分(BB)</div></div>
    </div>`;
  });
  return `<div class="rank-list">${rows}</div>`;
}
function detailHTML(p, withBack){
  const s=320;
  let six='';
  DIMS.forEach(d=>{ const nv=p.vals[d.key]; const over=nv>100; six+=`<div class="six-item"><div class="l">${d.label} <small>${d.sub}</small></div><div class="r" style="${over?'color:#1d4ed8;':''}">${nv}/100${over?' ↑':''}</div></div>`; });
  return `${withBack?'<div class="back" onclick="closeDetail()">‹ 返回榜单</div>':''}
  <div class="detail">
    <div class="det-hero"><div class="av">${p.nm[0]}</div><div class="nm">${p.nm}</div><div class="meta">2026-W26 · 高额桌 · 100/200</div></div>
    <div class="det-stats">
      <div class="s"><div class="v ${p.score>=0?'pos':'neg'}">${p.score>0?'+':''}${p.score.toFixed(1)}</div><div class="k">积分(BB)</div></div>
      <div class="s"><div class="v">${p.hands}</div><div class="k">有效手数</div></div>
      <div class="s"><div class="v">${Math.round(avg6(p.vals))}</div><div class="k">六维均分</div></div>
    </div>
    <div class="det-radar"><h4>打法画像 · 六星图</h4><div class="desc">满档=100（雷达边缘），高出的维度可突破至 130、冲出边缘</div>${radarSVG(p.vals,s)}</div>
    <div class="det-six">${six}</div>
  </div>`;
}
function openDetail(i){ curPlayer=i; renderDevice(); }
function closeDetail(){ curPlayer=null; renderDevice(); }

function renderDevice(){
  const mount=document.getElementById('device-mount');
  const season=`<div class="app-head"><div class="t">🏆 高额积分榜</div>
      <div class="season"><span>赛季 2026-W26（本周）</span><span class="countdown">距清零 2天14时</span></div></div>`;
  if(curDevice==='app'||curDevice==='h5'){
    const tag = curDevice==='h5' ? '<div style="text-align:center;font-size:11px;color:#94a3b8;padding:6px;background:#fff;">— H5 内嵌 / 免登录可浏览 —</div>' : '';
    let body = curPlayer!==null ? detailHTML(PLAYERS[curPlayer], true)
      : season + `<div class="tabbar"><div class="on">积分榜</div><div>选手</div><div>规则</div></div>` + listHTML();
    mount.innerHTML=`<div class="device phone"><div class="scr">${tag}${body}</div></div>`;
  } else {
    // PC：左榜单 右详情
    const p = curPlayer!==null ? PLAYERS[curPlayer] : PLAYERS[0];
    mount.innerHTML=`<div class="device pc"><div class="scr"><div class="pc-layout">
      <div class="pc-left"><div class="pc-head"><div class="t">🏆 高额积分榜 · 2026-W26</div><div style="font-size:12px;color:#94a3b8;">距清零 2天14时</div></div>${listHTML()}</div>
      <div class="pc-right">${detailHTML(p,false)}</div>
    </div></div></div>`;
  }
}

/* init */
render();
</script>
</body>
</html>
